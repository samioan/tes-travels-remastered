name: CI

# Two things this can actually prove on a machine that has no game data,
# per game (Dawnstar and Stormhold, each its own job so one game's failure
# doesn't hide the other's result):
#
#   * the Debug build compiles, every target -- both the game and the
#     launcher, plus every milestone's own smoke test.
#   * the shipping configuration (*_DIST=ON, Release, static CRT) also
#     compiles, and the resulting port/dist/ passes check_dist.ps1 (no
#     accidentally-shipped game data, no VC++ runtime dependency, the
#     launcher's artwork actually embedded).
#   * the launcher's own smoke test (config round-trip, jar install
#     against a synthetic jar, the zip reader, version comparison, the
#     tag-prefix-filtered release parser) passes -- the one smoke test per
#     game that needs neither the real game data nor a network call.
#
# Oblivion has no buildable port yet (see NOTICE.md) and so no job here --
# add one once it does, following either job below as the template.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  windows-dawnstar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # CMake is already on the runner image; Ninja is not guaranteed to be,
      # and dawnstar/port/build.bat asks for it by name.
      - name: Install Ninja
        run: choco install ninja -y --no-progress

      # dawnstar/port/vcvars.bat finds whatever Visual Studio this machine
      # has through vswhere, which is why this workflow does not need to
      # know where that is.
      - name: Build Dawnstar (Debug, all targets)
        run: .\dawnstar\port\build.bat

      # cd into build/ first: the test's own asset paths assume it (the
      # same convention every other dawnstar smoke test uses for
      # ../../extracted), and it's the one thing a plain `.\...\launcher_smoke.exe`
      # invocation from the repo root got wrong the first time this ran in CI.
      - name: Dawnstar launcher smoke test
        working-directory: dawnstar/port/build
        run: .\launcher_smoke.exe

      - name: Build Dawnstar (shipping configuration)
        run: .\dawnstar\port\build_dist.bat ci-${{ github.run_number }}

      - name: Check the Dawnstar package
        run: .\dawnstar\port\check_dist.ps1

      # Worth keeping around: this is a complete, runnable build, so a
      # reviewer can download a pull request's launcher and try it without
      # building anything. It still needs the user's own game files.
      - name: Upload the Dawnstar build
        uses: actions/upload-artifact@v4
        with:
          name: dawnstar-remastered-ci-${{ github.run_number }}
          path: dawnstar/port/dist/
          retention-days: 14

  windows-stormhold:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      # stormhold/port/vcvars.bat finds whatever Visual Studio this machine
      # has through vswhere, same as dawnstar/port/vcvars.bat above.
      - name: Build Stormhold (Debug, all targets)
        run: .\stormhold\port\build.bat

      - name: Stormhold launcher smoke test
        working-directory: stormhold/port/build
        run: .\launcher_smoke.exe

      - name: Build Stormhold (shipping configuration)
        run: .\stormhold\port\build_dist.bat ci-${{ github.run_number }}

      - name: Check the Stormhold package
        run: .\stormhold\port\check_dist.ps1

      - name: Upload the Stormhold build
        uses: actions/upload-artifact@v4
        with:
          name: stormhold-remastered-ci-${{ github.run_number }}
          path: stormhold/port/dist/
          retention-days: 14
